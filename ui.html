<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Component Builder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: var(--figma-color-text);
    }

    p {
      margin: 0 0 16px 0;
      color: var(--figma-color-text-secondary);
    }

    .upload-area {
      border: 2px dashed var(--figma-color-border);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }

    .upload-area:hover {
      border-color: var(--figma-color-border-brand);
      background: var(--figma-color-bg-hover);
    }

    .upload-area.dragover {
      border-color: var(--figma-color-border-brand);
      background: var(--figma-color-bg-brand-secondary);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--figma-color-text);
    }

    .upload-hint {
      font-size: 12px;
      color: var(--figma-color-text-secondary);
    }

    input[type="file"] {
      display: none;
    }

    .button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .button-primary {
      background: var(--figma-color-bg-brand);
      color: var(--figma-color-text-onbrand);
    }

    .button-primary:hover:not(:disabled) {
      background: var(--figma-color-bg-brand-hover);
    }

    .button-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .update-mode {
      background: var(--figma-color-bg-secondary);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      display: none;
      border-left: 3px solid var(--figma-color-bg-warning);
    }

    .update-mode.visible {
      display: block;
    }

    .update-mode-title {
      font-weight: 600;
      color: var(--figma-color-text);
      margin-bottom: 4px;
    }

    .update-mode-text {
      font-size: 12px;
      color: var(--figma-color-text-secondary);
    }

    .file-info {
      background: var(--figma-color-bg-secondary);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .file-info.visible {
      display: block;
    }

    .file-name {
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--figma-color-text);
    }

    .file-details {
      font-size: 12px;
      color: var(--figma-color-text-secondary);
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.success {
      background: var(--figma-color-bg-success);
      color: var(--figma-color-text-success);
    }

    .status.error {
      background: var(--figma-color-bg-danger);
      color: var(--figma-color-text-danger);
    }

    .example {
      background: var(--figma-color-bg-secondary);
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
      font-size: 12px;
    }

    .example-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--figma-color-text);
    }

    .example-code {
      background: var(--figma-color-bg);
      border-radius: 4px;
      padding: 8px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 11px;
      overflow-x: auto;
      color: var(--figma-color-text-secondary);
    }
  </style>
</head>
<body>
  <h1>Component Builder</h1>
  <p>Upload a DSAi file containing component specifications and design tokens to generate Figma components.</p>

  <div class="status" id="status"></div>

  <div class="update-mode" id="updateMode">
    <div class="update-mode-title">🔄 Update Mode</div>
    <div class="update-mode-text">A component with this name already exists. It will be updated with new variants.</div>
  </div>

  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📁</div>
    <div class="upload-text">Drop a component here or click to browse</div>
    <div class="upload-hint">Accepts .json files</div>
  </div>

  <input type="file" id="fileInput" accept=".json">

  <div class="file-info" id="fileInfo">
    <div class="file-name" id="fileName"></div>
    <div class="file-details" id="fileDetails"></div>
  </div>

  <button class="button button-primary" id="createBtn" disabled>
    Create Components
  </button>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileDetails = document.getElementById('fileDetails');
    const createBtn = document.getElementById('createBtn');
    const status = document.getElementById('status');
    const updateMode = document.getElementById('updateMode');

    let uploadedJSON = null;

    // Click to browse
    uploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    // File selected via input
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // Drag and drop
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // Handle file upload
    function handleFile(file) {
      if (!file.name.endsWith('.json')) {
        showStatus('Please upload a .json file', 'error');
        return;
      }

      const reader = new FileReader();
      
      reader.onload = (e) => {
        try {
          const jsonContent = e.target.result;
          uploadedJSON = JSON.parse(jsonContent);

          // Validate JSON structure (new format)
          if (!uploadedJSON.componentSet || !uploadedJSON.defaultStyles || !uploadedJSON.variants) {
            showStatus('Invalid JSON structure. Expected componentSet, defaultStyles, and variants.', 'error');
            return;
          }

          // Show file info
          fileName.textContent = `📄 ${file.name}`;
          fileDetails.textContent = `Size: ${(file.size / 1024).toFixed(2)} KB`;
          fileInfo.classList.add('visible');

          // Show update mode info if component name is detected
          const componentName = uploadedJSON.componentSet?.name;
          if (componentName) {
            updateMode.querySelector('.update-mode-text').textContent = 
              `Component: ${componentName}`;
            updateMode.classList.add('visible');
          } else {
            updateMode.classList.remove('visible');
          }

          // Enable create button
          createBtn.disabled = false;

          showStatus('JSON file loaded successfully!', 'success');
        } catch (error) {
          showStatus(`Error parsing JSON: ${error.message}`, 'error');
          uploadedJSON = null;
          createBtn.disabled = true;
        }
      };

      reader.onerror = () => {
        showStatus('Error reading file', 'error');
      };

      reader.readAsText(file);
    }

    // Create components
    createBtn.addEventListener('click', () => {
      if (uploadedJSON) {
        showStatus('Creating components...', 'success');
        createBtn.disabled = true;
        
        parent.postMessage({
          pluginMessage: {
            type: 'upload-json',
            data: JSON.stringify(uploadedJSON)
          }
        }, '*');

        // Re-enable after a delay
        setTimeout(() => {
          createBtn.disabled = false;
        }, 2000);
      }
    });

    // Show status message
    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status visible ${type}`;
      
      // Auto-hide success messages
      if (type === 'success') {
        setTimeout(() => {
          status.classList.remove('visible');
        }, 3000);
      }
    }
  </script>
</body>
</html>
